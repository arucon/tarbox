name: Verify archived tarballs
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read every tracked archive and record SHA-256 hashes
        run: |
          mapfile -d '' archives < <(git ls-files -z -- '*.tar' '*.gz')
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            tar -tf "$archive" >/dev/null
          done
          sha256sum -- "${archives[@]}" > "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarbox-checksums
          path: ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
